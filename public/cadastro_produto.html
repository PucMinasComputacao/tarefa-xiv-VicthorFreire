<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produto</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <h1>Cadastro de Produto</h1>
        <a class="link-cadastro" href="index.html">Voltar para Home</a>
    </header>

    <main class="container">
        <form id="formProduto" class="form-box">
            <label>Nome do produto</label>
            <input type="text" id="nome" required>

            <label>Descrição curta</label>
            <input type="text" id="descricaoCurta" required>

            <label>Descrição completa</label>
            <textarea id="descricaoCompleta" required></textarea>

            <label>URL da imagem</label>
            <input type="text" id="imagem" required>

            <label>Categoria</label>
            <select id="categoria" required>
                <option value="Notebooks">Notebooks</option>
                <option value="Acessórios">Acessórios</option>
                <option value="Celulares">Celulares</option>
                <option value="Games">Games</option>
                <option value="Monitores">Monitores</option>
            </select>

            <label>Preço</label>
            <input type="number" id="preco" min="0" step="0.01" required>

            <label>Tags separadas por vírgula</label>
            <input type="text" id="tags" placeholder="gamer, tecnologia, promoção" required>

            <label class="checkbox">
                <input type="checkbox" id="destaque">
                Produto em destaque
            </label>

            <label class="checkbox">
                <input type="checkbox" id="emEstoque" checked>
                Produto em estoque
            </label>

            <button type="submit">Cadastrar</button>
            <p id="message"></p>
        </form>
    </main>

    <script src="cadastro.js"></script>
</body>
</html>
